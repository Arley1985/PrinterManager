<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Impresoras Universidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              institutional: {
                red: '#7f1d1d',
                crimson: '#991b1b',
                dark: '#111827',
                graphite: '#1f2937',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useState, useCallback } = React;

      const API_BASE = '/api';
      const TOKEN_KEY = 'printer_manager_token';
      const USER_KEY = 'printer_manager_user';

      function getAuthHeader() {
        const token = localStorage.getItem(TOKEN_KEY);
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      async function apiRequest(endpoint, options = {}) {
        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...getAuthHeader(),
            ...(options.headers || {}),
          },
        });

        if (response.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
          window.location.reload();
          throw new Error('Sesión expirada');
        }

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || 'Error en la petición');
        }
        return data;
      }

      function PrinterIcon() {
        return (
          <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-red-950/70 ring-1 ring-red-800/60">
            <svg viewBox="0 0 24 24" fill="none" className="h-8 w-8 text-red-200" aria-hidden="true">
              <path d="M7 8V3h10v5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M7 17H5a2 2 0 0 1-2-2v-4a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v4a2 2 0 0 1-2 2h-2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M7 14h10v7H7z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M17 12h.01" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" />
            </svg>
          </div>
        );
      }

      function PrinterCard({ printer, onDelete, isAdmin }) {
        return (
          <a
            href={`http://${printer.ip}`}
            target="_blank"
            rel="noopener noreferrer"
            className="group relative block rounded-3xl border border-slate-700/70 bg-slate-900/80 p-5 shadow-xl shadow-black/20 transition hover:-translate-y-1 hover:border-red-700 hover:bg-slate-900 hover:shadow-red-950/30"
          >
            <div className="flex items-start justify-between gap-4">
              <PrinterIcon />
              <span className="rounded-full bg-slate-800 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-red-200 ring-1 ring-slate-700">
                {printer.brand}
              </span>
            </div>
            <div className="mt-5">
              <h3 className="text-xl font-bold text-white group-hover:text-red-100">{printer.name}</h3>
              <p className="mt-2 font-mono text-sm text-red-200">http://{printer.ip}</p>
              <p className="mt-3 text-sm text-slate-300">Ubicación: {printer.location}</p>
            </div>
            <div className="mt-5 flex items-center text-sm font-semibold text-slate-400 group-hover:text-red-200">
              Abrir interfaz web
              <span className="ml-2 transition group-hover:translate-x-1">→</span>
            </div>
            {isAdmin && (
              <button
                onClick={(e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  if (confirm(`¿Eliminar "${printer.name}" (${printer.ip})?`)) {
                    onDelete(printer.id);
                  }
                }}
                className="absolute top-4 right-4 rounded-lg bg-red-950/80 px-3 py-1 text-xs font-semibold text-red-200 ring-1 ring-red-800/60 opacity-0 group-hover:opacity-100 transition hover:bg-red-900"
              >
                Eliminar
              </button>
            )}
          </a>
        );
      }

      function LoginForm({ onLogin, mode, setMode }) {
        const [form, setForm] = useState({ username: '', password: '' });
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);

        const handleSubmit = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');

          try {
            const endpoint = mode === 'login' ? '/auth/login' : '/auth/register';
            const data = await apiRequest(endpoint, {
              method: 'POST',
              body: JSON.stringify(form),
            });

            localStorage.setItem(TOKEN_KEY, data.access_token);
            const userData = await apiRequest('/auth/me');
            localStorage.setItem(USER_KEY, JSON.stringify(userData));
            onLogin(userData);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="w-full max-w-md mx-auto">
            <div className="rounded-[2rem] border border-red-900/50 bg-slate-950/70 p-8 shadow-2xl shadow-black/30 backdrop-blur">
              <div className="text-center mb-8">
                <PrinterIcon />
                <h1 className="mt-4 text-3xl font-black tracking-tight text-white">Gestión de Impresoras</h1>
                <p className="mt-2 text-slate-400">{mode === 'login' ? 'Iniciar sesión' : 'Crear cuenta'}</p>
              </div>

              <form className="space-y-4" onSubmit={handleSubmit}>
                <label className="block">
                  <span className="text-sm font-semibold text-slate-200">Usuario</span>
                  <input
                    required
                    name="username"
                    value={form.username}
                    onChange={(e) => setForm({ ...form, username: e.target.value })}
                    placeholder="admin"
                    autoComplete="username"
                    className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
                  />
                </label>

                <label className="block">
                  <span className="text-sm font-semibold text-slate-200">Contraseña</span>
                  <input
                    required
                    type="password"
                    name="password"
                    value={form.password}
                    onChange={(e) => setForm({ ...form, password: e.target.value })}
                    placeholder="••••••••"
                    autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                    className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
                  />
                </label>

                {error && (
                  <p className="rounded-xl bg-red-950/80 px-4 py-3 text-sm text-red-100 ring-1 ring-red-800 text-center">
                    {error}
                  </p>
                )}

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full rounded-xl bg-red-800 px-5 py-3 font-bold text-white shadow-lg shadow-red-950/40 transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60"
                >
                  {loading ? 'Cargando...' : mode === 'login' ? 'Entrar' : 'Registrarse'}
                </button>
              </form>

              <p className="mt-6 text-center text-sm text-slate-400">
                {mode === 'login' ? (
                  <>
                    ¿No tienes cuenta?{' '}
                    <button
                      type="button"
                      onClick={() => setMode('register')}
                      className="font-semibold text-red-200 hover:text-red-100 underline"
                    >
                      Regístrate
                    </button>
                  </>
                ) : (
                  <>
                    ¿Ya tienes cuenta?{' '}
                    <button
                      type="button"
                      onClick={() => setMode('login')}
                      className="font-semibold text-red-200 hover:text-red-100 underline"
                    >
                      Inicia sesión
                    </button>
                  </>
                )}
              </p>

              {mode === 'login' && (
                <p className="mt-4 text-center text-xs text-slate-500">
                  Usuario por defecto: <code className="font-mono text-slate-300">admin</code> /
                  <code className="font-mono text-slate-300">admin123</code>
                </p>
              )}
            </div>
          </div>
        );
      }

      function Header({ user, onLogout }) {
        return (
          <header className="overflow-hidden rounded-[2rem] border border-red-900/50 bg-slate-950/70 p-7 shadow-2xl shadow-black/30 backdrop-blur md:p-10">
            <div className="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
              <div>
                <p className="text-sm font-bold uppercase tracking-[0.35em] text-red-300">Universidad</p>
                <h1 className="mt-3 text-4xl font-black tracking-tight text-white md:text-6xl">Gestión de Impresoras</h1>
                <p className="mt-4 max-w-2xl text-slate-300">Registra equipos por bloque y abre su interfaz interna directamente desde el tablero.</p>
              </div>
              <div className="flex flex-col gap-4 lg:flex-row lg:items-center">
                <div className="rounded-2xl bg-red-950/60 px-5 py-4 text-center ring-1 ring-red-800/60">
                  <p className="text-4xl font-black text-white" id="printer-count">0</p>
                  <p className="text-sm font-semibold text-red-200">impresoras registradas</p>
                </div>
                <div className="flex items-center gap-4 text-sm text-slate-300">
                  <span>Bienvenido, <strong className="text-white">{user?.username}</strong></span>
                  {user?.is_admin && (
                    <span className="rounded-full bg-red-950/60 px-3 py-1 text-xs font-bold uppercase tracking-wide text-red-200 ring-1 ring-red-800/60">
                      Admin
                    </span>
                  )}
                  <button
                    onClick={onLogout}
                    className="rounded-lg bg-slate-800 px-4 py-2 font-semibold text-slate-100 transition hover:bg-red-900"
                  >
                    Cerrar sesión
                  </button>
                </div>
              </div>
            </div>
          </header>
        );
      }

      function PrinterForm({ onSubmit, initialData, saving, error, isAdmin }) {
        const [form, setForm] = useState({
          name: initialData?.name || '',
          ip: initialData?.ip || '',
          brand: initialData?.brand || 'HP',
          location: initialData?.location || '',
        });

        function updateField(e) {
          const { name, value } = e.target;
          setForm((current) => ({ ...current, [name]: value }));
        }

        if (!isAdmin) return null;

        return (
          <form className="mt-6 space-y-4" onSubmit={onSubmit}>
            <label className="block">
              <span className="text-sm font-semibold text-slate-200">Nombre de la impresora</span>
              <input
                required
                name="name"
                value={form.name}
                onChange={updateField}
                placeholder="Registro y Control"
                className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
              />
            </label>

            <label className="block">
              <span className="text-sm font-semibold text-slate-200">Dirección IP</span>
              <input
                required
                name="ip"
                value={form.ip}
                onChange={updateField}
                placeholder="10.20.50.15"
                className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 font-mono text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
              />
            </label>

            <label className="block">
              <span className="text-sm font-semibold text-slate-200">Marca</span>
              <select
                name="brand"
                value={form.brand}
                onChange={updateField}
                className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
              >
                <option>HP</option>
                <option>Kyocera</option>
                <option>Ricoh</option>
                <option>Otra</option>
              </select>
            </label>

            <label className="block">
              <span className="text-sm font-semibold text-slate-200">Ubicación/Bloque</span>
              <input
                required
                name="location"
                value={form.location}
                onChange={updateField}
                placeholder="Bloque A - Piso 2"
                className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
              />
            </label>

            {error && (
              <p className="rounded-xl bg-red-950/80 px-4 py-3 text-sm text-red-100 ring-1 ring-red-800">{error}</p>
            )}

            <button
              type="submit"
              disabled={saving}
              className="w-full rounded-xl bg-red-800 px-5 py-3 font-bold text-white shadow-lg shadow-red-950/40 transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60"
            >
              {saving ? 'Guardando...' : 'Guardar Impresora'}
            </button>
          </form>
        );
      }

      function ScanForm({ onScan, scanNetwork, setScanNetwork, scanning, scanResults, scanError, onUseIp }) {
        return (
          <form className="mt-5 space-y-4" onSubmit={onScan}>
            <label className="block">
              <span className="text-sm font-semibold text-slate-200">Rango CIDR</span>
              <input
                required
                value={scanNetwork}
                onChange={(e) => setScanNetwork(e.target.value)}
                placeholder="192.168.1.0/24"
                className="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 font-mono text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-900"
              />
            </label>

            {scanError && (
              <p className="rounded-xl bg-red-950/80 px-4 py-3 text-sm text-red-100 ring-1 ring-red-800">{scanError}</p>
            )}

            <button
              type="submit"
              disabled={scanning}
              className="w-full rounded-xl border border-red-800 px-5 py-3 font-bold text-red-100 transition hover:bg-red-950 disabled:cursor-not-allowed disabled:opacity-60"
            >
              {scanning ? 'Escaneando...' : 'Escanear Red'}
            </button>
          </form>
        );
      }

      function ScanResults({ results, onUseIp }) {
        if (!results.length) return null;

        return (
          <div className="mt-5 space-y-3">
            {results.map((result) => (
              <div key={result.ip} className="rounded-2xl border border-slate-700 bg-slate-950/70 p-4">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <p className="font-mono font-bold text-red-100">{result.ip}</p>
                    <p className="mt-1 text-xs text-slate-400">Puertos: {result.open_ports.join(', ')}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => onUseIp(result.ip)}
                    className="rounded-lg bg-slate-800 px-3 py-2 text-xs font-bold text-slate-100 transition hover:bg-red-900"
                  >
                    Usar IP
                  </button>
                </div>
                {result.web_url && (
                  <a href={result.web_url} target="_blank" rel="noopener noreferrer" className="mt-3 inline-block text-sm font-semibold text-red-200 hover:text-red-100">
                    Abrir panel web
                  </a>
                )}
              </div>
            ))}
          </div>
        );
      }

      function App() {
        const [user, setUser] = useState(null);
        const [printers, setPrinters] = useState([]);
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [error, setError] = useState('');
        const [scanNetwork, setScanNetwork] = useState('192.168.1.0/24');
        const [scanResults, setScanResults] = useState([]);
        const [scanning, setScanning] = useState(false);
        const [scanError, setScanError] = useState('');
        const [loginMode, setLoginMode] = useState('login');

        const loadPrinters = useCallback(async () => {
          try {
            const data = await apiRequest('/printers');
            setPrinters(data);
            document.getElementById('printer-count').textContent = data.length;
          } catch (err) {
            setError('No se pudo cargar la lista de impresoras.');
          } finally {
            setLoading(false);
          }
        }, []);

        const checkAuth = useCallback(async () => {
          const token = localStorage.getItem(TOKEN_KEY);
          const storedUser = localStorage.getItem(USER_KEY);
          if (token && storedUser) {
            try {
              const userData = await apiRequest('/auth/me');
              setUser(userData);
              localStorage.setItem(USER_KEY, JSON.stringify(userData));
            } catch {
              localStorage.removeItem(TOKEN_KEY);
              localStorage.removeItem(USER_KEY);
            }
          }
          setLoading(false);
        }, []);

        useEffect(() => {
          checkAuth();
        }, [checkAuth]);

        useEffect(() => {
          if (user) {
            loadPrinters();
          }
        }, [user, loadPrinters]);

        const handleLogin = (userData) => {
          setUser(userData);
          setError('');
        };

        const handleLogout = () => {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
          setUser(null);
          setPrinters([]);
        };

        const handleSavePrinter = async (e) => {
          e.preventDefault();
          setSaving(true);
          setError('');

          try {
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const created = await apiRequest('/printers', {
              method: 'POST',
              body: JSON.stringify(data),
            });
            setPrinters((current) => [created, ...current]);
            document.getElementById('printer-count').textContent = current.length + 1;
            e.target.reset();
          } catch (err) {
            setError(err.message);
          } finally {
            setSaving(false);
          }
        };

        const handleDeletePrinter = async (id) => {
          try {
            await apiRequest(`/printers/${id}`, { method: 'DELETE' });
            setPrinters((current) => current.filter((p) => p.id !== id));
            document.getElementById('printer-count').textContent = printers.length - 1;
          } catch (err) {
            alert(err.message);
          }
        };

        const handleScan = async (e) => {
          e.preventDefault();
          setScanning(true);
          setScanError('');

          try {
            const data = await apiRequest(`/scan?network=${encodeURIComponent(scanNetwork)}`);
            setScanResults(data);
          } catch (err) {
            setScanError(err.message);
          } finally {
            setScanning(false);
          }
        };

        const handleUseIp = (ip) => {
          const form = document.querySelector('form[action="/printers"]') || document.querySelector('form');
          if (form) {
            form.querySelector('[name="ip"]').value = ip;
            form.querySelector('[name="name"]').value = form.querySelector('[name="name"]').value || `Impresora ${ip}`;
            form.querySelector('[name="location"]').value = form.querySelector('[name="location"]').value || 'Por confirmar';
          }
        };

        if (!user) {
          return (
            <main className="min-h-screen bg-[radial-gradient(circle_at_top_left,#3f0b0b,transparent_34%),linear-gradient(135deg,#111827,#020617_55%,#171717)] flex items-center justify-center px-4 py-12">
              <LoginForm onLogin={handleLogin} mode={loginMode} setMode={setLoginMode} />
            </main>
          );
        }

        const isAdmin = user?.is_admin === 1;

        return (
          <main className="min-h-screen bg-[radial-gradient(circle_at_top_left,#3f0b0b,transparent_34%),linear-gradient(135deg,#111827,#020617_55%,#171717)]">
            <section className="mx-auto flex w-full max-w-7xl flex-col gap-8 px-5 py-8 md:px-8 lg:py-12">
              <Header user={user} onLogout={handleLogout} />

              <div className="grid gap-8 lg:grid-cols-[380px_1fr]">
                <section className="rounded-[2rem] border border-slate-700 bg-slate-900/85 p-6 shadow-xl shadow-black/20">
                  {isAdmin && (
                    <>
                      <h2 className="text-2xl font-bold text-white">Nuevo Registro</h2>
                      <p className="mt-2 text-sm text-slate-400">Los datos se guardan en SQLite y aparecen al instante en el tablero.</p>
                      <PrinterForm onSubmit={handleSavePrinter} saving={saving} error={error} isAdmin={isAdmin} />
                    </>
                  )}

                  <div className="mt-8 border-t border-slate-700 pt-6">
                    <h2 className="text-2xl font-bold text-white">Detectar en Red</h2>
                    <p className="mt-2 text-sm text-slate-400">Busca equipos con puertos comunes de impresora abiertos dentro de una red autorizada.</p>

                    <ScanForm
                      onScan={handleScan}
                      scanNetwork={scanNetwork}
                      setScanNetwork={setScanNetwork}
                      scanning={scanning}
                      scanResults={scanResults}
                      scanError={scanError}
                      onUseIp={handleUseIp}
                    />

                    <ScanResults results={scanResults} onUseIp={handleUseIp} />

                    {!scanning && scanResults.length === 0 && !scanError && (
                      <p className="text-sm text-slate-500">Sin resultados todavía. Ejecuta un escaneo para listar equipos encontrados.</p>
                    )}
                  </div>
                </section>

                <section className="rounded-[2rem] border border-slate-800 bg-slate-950/70 p-6 shadow-xl shadow-black/20">
                  <div className="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                      <h2 className="text-2xl font-bold text-white">Tablero Principal</h2>
                      <p className="mt-2 text-sm text-slate-400">Cada tarjeta es un enlace real a la interfaz web interna de la impresora.</p>
                    </div>
                    <span className="rounded-full border border-slate-700 px-4 py-2 text-sm text-slate-300">Modo oscuro activo</span>
                  </div>

                  {loading ? (
                    <p className="mt-10 text-slate-400">Cargando impresoras...</p>
                  ) : printers.length === 0 ? (
                    <div className="mt-10 rounded-3xl border border-dashed border-slate-700 p-10 text-center">
                      <p className="text-lg font-semibold text-slate-200">Aún no hay impresoras registradas.</p>
                      {isAdmin && <p className="mt-2 text-slate-500">Agrega la primera desde el formulario.</p>}
                      {!isAdmin && <p className="mt-2 text-slate-500">Contacta al administrador para añadir impresoras.</p>}
                    </div>
                  ) : (
                    <div className="mt-6 grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
                      {printers.map((printer) => (
                        <PrinterCard key={printer.id} printer={printer} onDelete={handleDeletePrinter} isAdmin={isAdmin} />
                      ))}
                    </div>
                  )}
                </section>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
